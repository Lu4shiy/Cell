<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bee Clicker</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #15110d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }
    #score {
      font-size: 32px;
      font-weight: bold;
      color: #f5a623;
      margin-bottom: 20px;
    }
    #game-area {
      width: 90vw;
      height: 60vh;
      background: #241c15;
      border: 2px solid #2a2018;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .bee {
      position: absolute;
      font-size: 50px;
      cursor: pointer;
      transition: transform 0.1s;
      transform: translate(-50%, -50%);
    }
    .bee:active {
      transform: translate(-50%, -50%) scale(0.8);
    }
    @keyframes pop {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
    .score-popup {
      position: absolute;
      color: #6fbf4a;
      font-weight: bold;
      font-size: 20px;
      pointer-events: none;
      animation: pop 0.5s ease-out forwards;
    }
  </style>
</head>
<body>

  <div id="score">Счёт: <span id="score-val">0</span></div>
  <div id="game-area" id="area"></div>

  <script>
    const area = document.getElementById('game-area');
    const scoreEl = document.getElementById('score-val');
    let score = 0;

    function spawnBee() {
      if (!area) return;
      
      const bee = document.createElement('div');
      bee.className = 'bee';
      bee.textContent = '🐝';
      
      // Позиция по краям (чтобы не спавнилась под пальцем)
      const x = Math.random() * 80 + 10; // 10% - 90%
      const y = Math.random() * 80 + 10;
      
      bee.style.left = `${x}%`;
      bee.style.top = `${y}%`;

      bee.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        score++;
        if (score === 10) {
          window.parent.postMessage({ type: "UNLOCK_ACHIEVEMENT", code: "score_10" }, "*");
        }
        scoreEl.textContent = score;
        
        // Эффект
        const popup = document.createElement('div');
        popup.className = 'score-popup';
        popup.textContent = '+1';
        popup.style.left = bee.style.left;
        popup.style.top = bee.style.top;
        area.appendChild(popup);
        
        setTimeout(() => popup.remove(), 500);
        
        bee.remove();
        setTimeout(spawnBee, Math.random() * 500 + 200);
      });

      area.appendChild(bee);
    }

    // Старт
    spawnBee();
    setTimeout(spawnBee, 500);
  </script>
</body>
</html>
