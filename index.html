<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imaginer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💭</text></svg>">
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="logo">Imaginer</h1>
      <p class="tagline">Твой личный мессенджер</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Пароль" required>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="form hidden">
        <input type="text" id="reg-username" placeholder="Логин (например, ivan)" required>
        <input type="text" id="reg-displayname" placeholder="Имя (например, Иван)" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required minlength="6">
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p class="error" id="register-error"></p>
      </form>
    </div>
  </div>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="app-screen" class="app hidden">

    <!-- ЛЕВАЯ ПАНЕЛЬ -->
    <aside class="sidebar">
      <header class="sidebar-header">
        <div class="me-info" id="me-info-btn" title="Профиль">
          <div class="avatar" id="me-avatar">?</div>
          <div class="me-text">
            <div class="me-name" id="me-name">Загрузка...</div>
            <div class="me-username" id="me-username">@...</div>
          </div>
        </div>
        <button id="logout-btn" class="icon-btn" title="Выйти">⎋</button>
      </header>

      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Поиск людей...">
      </div>

      <div class="section-title" id="section-title">Недавние чаты</div>
      <div id="users-list" class="users-list">
        <div class="empty">Загрузка...</div>
      </div>
    </aside>

    <!-- ПРАВАЯ ЧАСТЬ -->
    <main class="chat-area" id="chat-area">

      <div class="chat-placeholder" id="chat-placeholder">
        <div class="chat-placeholder-icon">💬</div>
        <p>Выбери человека слева, чтобы начать переписку</p>
      </div>

      <div id="chat-content" class="chat-content hidden">

        <header class="chat-header">
          <div class="avatar" id="chat-avatar">?</div>
          <div class="chat-header-text">
            <div class="chat-title" id="chat-title">Имя</div>
            <div class="chat-subtitle" id="chat-subtitle">@username</div>
          </div>
          <button id="chat-menu-btn" class="icon-btn" title="Меню">⋮</button>
          <div id="chat-menu" class="menu hidden">
            <button data-action="clear">Очистить чат</button>
            <button data-action="delete">Удалить чат</button>
            <button data-action="block" id="menu-block">Заблокировать</button>
          </div>
        </header>

        <div id="block-banner" class="block-banner hidden">
          <span id="block-banner-text"></span>
          <button id="unblock-btn" class="hidden">Разблокировать</button>
        </div>

        <div class="messages" id="messages"></div>

        <div id="reply-bar" class="reply-bar hidden">
          <div class="reply-bar-icon" id="reply-bar-icon">↩</div>
          <div class="reply-bar-content">
            <div class="reply-bar-title" id="reply-bar-title">Ответ</div>
            <div class="reply-bar-text" id="reply-bar-text"></div>
          </div>
          <button id="reply-bar-close" class="reply-bar-close" title="Отмена">✕</button>
        </div>

        <form class="composer" id="composer">
          <input type="text" id="message-input" placeholder="Написать сообщение..." autocomplete="off" maxlength="4000">
          <button type="submit" class="send-btn" id="send-btn" title="Отправить">➤</button>
        </form>

        <div id="selection-toolbar" class="selection-toolbar hidden">
          <span id="selection-count">Выбрано: 0</span>
          <div>
            <button id="sel-delete">Удалить</button>
            <button id="sel-forward">Переслать</button>
            <button id="sel-cancel">Отмена</button>
          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- Универсальный диалог -->
  <div id="dialog-overlay" class="dialog-overlay hidden">
    <div class="dialog">
      <div class="dialog-title" id="dialog-title"></div>
      <div class="dialog-text" id="dialog-text"></div>
      <div id="dialog-options" class="dialog-options"></div>
      <div class="dialog-actions">
        <button class="dialog-btn dialog-primary" id="dialog-confirm" disabled>Подтвердить</button>
        <button class="dialog-btn dialog-cancel" id="dialog-cancel">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Профиль -->
  <div id="profile-overlay" class="dialog-overlay hidden">
    <div class="dialog dialog-profile">
      <div class="dialog-title">Профиль</div>

      <div class="profile-section">
        <div class="profile-label">Аватар</div>
        <div class="avatar-preview">
          <div class="avatar avatar-large" id="profile-avatar-preview">?</div>
        </div>
        <div class="avatar-grid" id="avatar-grid"></div>
        <label class="upload-btn">
          Загрузить свою
          <input type="file" id="avatar-upload" accept="image/*" hidden>
        </label>
      </div>

      <div class="profile-section">
        <div class="profile-label">Имя пользователя</div>
        <div class="username-input-wrap">
          <span class="username-prefix">@</span>
          <input type="text" id="profile-username" placeholder="username" maxlength="32" autocomplete="off" spellcheck="false">
        </div>
        <div class="username-hint" id="username-hint"></div>
      </div>

      <div class="profile-section">
        <div class="profile-label">Цвет приложения</div>
        <div class="accent-grid" id="accent-grid"></div>
      </div>

      <div class="dialog-actions">
        <button class="dialog-btn dialog-cancel" id="profile-close">Закрыть</button>
      </div>
    </div>
  </div>

  <!-- ПКМ меню -->
  <div id="msg-context-menu" class="context-menu hidden">
    <button data-action="reply">Ответить</button>
    <button data-action="edit">Изменить</button>
    <button data-action="react">Реакция</button>
    <button data-action="fwd">Переслать</button>
    <button data-action="del">Удалить</button>
    <button data-action="sel">Выбрать</button>
  </div>

  <!-- Пикер реакций -->
  <div id="reaction-picker" class="reaction-picker hidden"></div>

  <!-- Диалог пересылки -->
  <div id="forward-overlay" class="dialog-overlay hidden">
    <div class="dialog">
      <div class="dialog-title">Переслать</div>
      <div class="dialog-text" id="forward-info">Выбери чаты</div>
      <div id="forward-list" class="forward-list"></div>
      <label class="toggle-row">
        <input type="checkbox" id="forward-hide-sender">
        <span>Скрыть отправителя</span>
      </label>
      <div class="dialog-actions">
        <button class="dialog-btn dialog-primary" id="forward-send">Переслать</button>
        <button class="dialog-btn dialog-cancel" id="forward-cancel">Отмена</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
