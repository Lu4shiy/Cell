<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imaginer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💭</text></svg>">
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="logo">Imaginer</h1>
      <p class="tagline">Твой личный мессенджер</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Пароль" required>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="form hidden">
        <input type="text" id="reg-username" placeholder="Логин (например, ivan)" required>
        <input type="text" id="reg-displayname" placeholder="Имя (например, Иван)" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required minlength="6">
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p class="error" id="register-error"></p>
      </form>
    </div>
  </div>

  <!-- ГЛАВНОЙ ЭКРАН (появится позже) -->
  <div id="app-screen" class="screen hidden">
    <div class="placeholder">
      <h1>Imaginer</h1>
      <p>Ты вошёл! 🎉</p>
      <p class="small">Следующий шаг — сделать чаты.</p>
      <button id="logout-btn" class="btn-secondary">Выйти</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
