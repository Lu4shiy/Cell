<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imaginer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💭</text></svg>">
</head>
<body>

  <!-- ЭКРАН ВХОДА -->
  <div id="auth-screen" class="screen">
    <div class="auth-card">
      <h1 class="logo">Imaginer</h1>
      <p class="tagline">Твой личный мессенджер</p>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Пароль" required>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="form hidden">
        <input type="text" id="reg-username" placeholder="Логин (например, ivan)" required>
        <input type="text" id="reg-displayname" placeholder="Имя (например, Иван)" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Пароль (мин. 6 символов)" required minlength="6">
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p class="error" id="register-error"></p>
      </form>
    </div>
  </div>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="app-screen" class="app hidden">

  <!-- ЛЕВАЯ ПАНЕЛЬ: список чатов и людей -->
  <aside class="sidebar">
    <header class="sidebar-header">
      <div class="me-info">
        <div class="avatar" id="me-avatar">?</div>
        <div class="me-text">
          <div class="me-name" id="me-name">Загрузка...</div>
          <div class="me-username" id="me-username">@...</div>
        </div>
      </div>
      <button id="logout-btn" class="icon-btn" title="Выйти">⎋</button>
    </header>

    <div class="search-wrap">
      <input type="text" id="search-input" placeholder="Поиск людей...">
    </div>

    <div class="section-title" id="section-title">Недавние чаты</div>
    <div id="users-list" class="users-list">
      <div class="empty">Загрузка...</div>
    </div>
  </aside>

  <!-- ПРАВАЯ ЧАСТЬ: окно чата -->
<main class="chat-area" id="chat-area">
  <div class="chat-placeholder" id="chat-placeholder">
    <div class="chat-placeholder-icon">💬</div>
    <p>Выбери человека слева, чтобы начать переписку</p>
  </div>

  <div id="chat-content" class="chat-content hidden">
    <header class="chat-header">
      <div class="avatar" id="chat-avatar">?</div>
      <div class="chat-header-text">
        <div class="chat-title" id="chat-title">Имя</div>
        <div class="chat-subtitle" id="chat-subtitle">@username</div>
      </div>
    </header>

    <div class="messages" id="messages"></div>

    <form class="composer" id="composer">
      <input type="text" id="message-input" placeholder="Написать сообщение..." autocomplete="off" maxlength="4000">
      <button type="submit" class="send-btn" title="Отправить">➤</button>
    </form>
  </div>
</main>

</div>

  <script type="module" src="app.js"></script>
</body>
</html>
